<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#292524" stroke-width="4" />

  <!-- Central badge -->
  <circle cx="256" cy="256" r="160" fill="url(#gemGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="156" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-opacity="0.6" />

  <!-- Microphone Iconography -->
  <!-- Mic Capsule -->
  <rect x="226" y="156" width="60" height="110" rx="30" fill="#09090b" stroke="#ffffff" stroke-width="10" />
  
  <!-- Sound Pickup Grill -->
  <line x1="238" y1="190" x2="274" y2="190" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="238" y1="210" x2="274" y2="210" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="238" y1="230" x2="274" y2="230" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Mic Cradle / U-Shape -->
  <path d="M 200 220 C 200 286 312 286 312 220" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

  <!-- Mic Stem and Base -->
  <line x1="256" y1="284" x2="256" y2="330" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <line x1="216" y1="330" x2="296" y2="330" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

  <!-- Audio Waves on Left and Right -->
  <!-- Left Waves -->
  <path d="M 166 215 A 50 50 0 0 0 166 285" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" />
  <path d="M 142 195 A 80 80 0 0 0 142 305" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Right Waves -->
  <path d="M 346 215 A 50 50 0 0 1 346 285" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" />
  <path d="M 370 195 A 80 80 0 0 1 370 305" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Sparkle Accent Top Right -->
  <path d="M 330 140 Q 330 160 350 160 Q 330 160 330 180 Q 330 160 310 160 Q 330 160 330 140 Z" fill="#fef08a" />
</svg>
