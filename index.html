<!doctype html>
<html lang="en">
  <head>
    <script>
      // Filter out benign Vite HMR websocket notices in sandboxed AI Studio preview iframe
      (function() {
        function shouldFilter(msg) {
          if (!msg) return false;
          var str = '';
          try {
            str = typeof msg === 'string' ? msg : (msg.message || JSON.stringify(msg) || String(msg));
          } catch(e) {
            str = String(msg);
          }
          str = str.toLowerCase();
          return str.includes('[vite]') || str.includes('websocket') || str.includes('vite-plugin-pwa');
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldFilter(arguments[i])) {
              return;
            }
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldFilter(arguments[i])) {
              return;
            }
          }
          origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (event && (shouldFilter(event.message) || shouldFilter(event.filename) || shouldFilter(event.error))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && shouldFilter(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();

      // Early capture of PWA beforeinstallprompt event
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      });
    </script>
