<!doctype html>
<html lang="en">
  <head>
    <script>
      // Filter out benign Vite HMR websocket notices in sandboxed AI Studio preview iframe
      (function() {
        var _err = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string' && (arg.indexOf('[vite]') !== -1 || arg.indexOf('vite-plugin-pwa') !== -1)) {
              console.debug.apply(console, arguments);
              return;
            }
            if (arg && typeof arg === 'object' && arg.message && typeof arg.message === 'string' && (arg.message.indexOf('WebSocket') !== -1 || arg.message.indexOf('vite') !== -1)) {
              console.debug.apply(console, arguments);
              return;
            }
          }
          _err.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var reasonStr = String((event.reason && event.reason.message) || event.reason);
            if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('vite') !== -1) {
              event.preventDefault();
            }
          }
        });
      })();
    </script>
